# CI: does it build. Nothing else.
#
# The test suite does not run here. It is gated locally on both toolchains for
# every change (docs/CLAUDE.md, Build & run), alongside the hardware gates no
# runner can do. CI answers one question per platform:
#   linux   - debian:trixie container, the same distro as the WSL2 inner loop.
#             Catches a Windows-ism leaking into core/ the moment it appears.
#   windows - MSYS2 UCRT64, building the product that ships (Option C: vendored
#             PDCursesMod, static) and checking it still needs only its two
#             deliberately-dynamic DLLs.
name: CI

on:
  push:
    branches: [restructure, main, experimental/win-pdcurses]
  pull_request:
    branches: [restructure, main, experimental/win-pdcurses]

jobs:
  linux:
    name: Linux (Debian Trixie container)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install toolchain + deps
        run: |
          # fdk-aac lives in non-free - enable the extra components (the same
          # one-line change the WSL2 inner loop needed; readiness doc §4).
          sed -i 's/^Components: main.*/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/*.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential g++ cmake ninja-build pkg-config git ca-certificates \
            libflac-dev libmp3lame-dev libebur128-dev libfdk-aac-dev \
            libopus-dev libopusfile-dev libopusenc-dev libwavpack-dev libvorbis-dev \
            libncurses-dev libtag-dev libcurl4-openssl-dev libnotify-dev \
            libasound2-dev libpulse-dev libsystemd-dev
      - uses: actions/checkout@v5
      # The prefixed-include convention for codec headers, machine-enforced
      # before any compile (the CMake -I ordering that also protects it is
      # defense-in-depth only).
      - name: Include-guard lint (bare codec headers)
        run: |
          # Forbid bare <opusfile.h>/<vorbisfile.h>: must be <opus/...> / <vorbis/...>.
          # TagLib ships taglib/opusfile.h + taglib/vorbisfile.h on the same include path;
          # a bare include silently resolves to the C++ tag class instead of the C codec API.
          if grep -rnE '#[[:space:]]*include[[:space:]]*<(opusfile|vorbisfile)\.h>' src/ include/; then
            echo "ERROR: bare <opusfile.h>/<vorbisfile.h> include - use the codec prefix." >&2
            exit 1
          fi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREMOCT_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-flac
            mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-libebur128
            mingw-w64-ucrt-x86_64-fdk-aac
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-opusfile
            mingw-w64-ucrt-x86_64-libopusenc
            mingw-w64-ucrt-x86_64-wavpack
            mingw-w64-ucrt-x86_64-libvorbis
      - uses: actions/checkout@v5
      - name: Configure (Option C)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DREMOCT_PDCURSES=ON -DREMOCT_STATIC_PROBE=ON \
                -DREMOCT_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build
      # The ONLY non-system DLLs across the exe and the stream plugin must be
      # libfdk-aac-2.dll + libebur128.dll (the two documented, deliberately-
      # dynamic codecs). A third sneaking back in (e.g. libstdc++ / libgcc_s)
      # fails the build - the Phase-5 graduation gate, mechanised.
      - name: Option C dependents check (2-DLL allowlist)
        run: |
          set -e
          deps=$( { ldd build/bin/remoct.exe; \
                    ldd build/bin/plugins/remoct_stream.dll; } \
                  | grep '=>' | grep -iv '/windows/' | awk '{print $1}' | sort -u )
          echo "Non-system DLL dependencies (exe + plugin):"
          echo "$deps"
          fail=0
          for d in $deps; do
            case "$d" in
              libfdk-aac-2.dll|libebur128.dll) ;;
              *) echo "::error::disallowed non-system DLL: $d"; fail=1 ;;
            esac
          done
          if [ "$fail" != "0" ]; then
            echo "Option C dependents check FAILED"; exit 1
          fi
          echo "Option C dependents check PASSED - only libfdk-aac-2.dll + libebur128.dll"
